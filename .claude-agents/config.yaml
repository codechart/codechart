# .claude-agents/config.yaml
# Agent registry - maps agent names to their prompt files

agents:
  coder:
    prompt: agents/coder.md
    description: Backend engineer - implements features and fixes bugs

  qa:
    prompt: agents/qa.md
    description: QA engineer - tests and validates functionality

# To add a custom agent:
# 1. Copy agents/_template.md to agents/your-agent.md
# 2. Edit your-agent.md with role and rules
# 3. Add entry here:
#    your-agent:
#      prompt: agents/your-agent.md
#      description: Your agent description
