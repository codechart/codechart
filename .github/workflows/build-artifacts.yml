  #         docker cp temp-intellij-container:/tmp/ artifacts/tmp/ || true
  #
  #         echo "IntelliJ plugin artifacts:"
  #         find artifacts -type f -name "*.zip" || echo "No zip files found"
  #         ls -la artifacts/
  #
  #         docker rm temp-intellij-container
  #
  #     - name: Upload IntelliJ artifacts
