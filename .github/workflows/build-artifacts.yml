  #         path: artifacts/

  create-release:
    needs: [build-downloads, build-vscode]
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create_release.outputs.id }}
    steps:
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: build-${{ github.sha }}
          release_name: Railway Test Build ${{ github.sha }}
          draft: false
          prerelease: false

  upload-artifacts:
    needs: [build-downloads, build-vscode, create-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts
      
      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          
          echo "Debug: Checking all-artifacts structure:"
          find all-artifacts -type f -name "*.zip" -o -name "*.tar.gz" -o -name "*.vsix" | head -20
          
          # Copy download artifacts (look for them recursively)
          if [ -d "all-artifacts/download-artifacts" ]; then
            find all-artifacts/download-artifacts -type f \( -name "*.zip" -o -name "*.tar.gz" \) -exec cp {} release-assets/ \; 2>/dev/null || echo "No download files found"
          fi
          
          # Copy VS Code plugin (look for it recursively)
          if [ -d "all-artifacts/vscode-artifacts" ]; then
            find all-artifacts/vscode-artifacts -type f -name "*.vsix" -exec cp {} release-assets/ \; 2>/dev/null || echo "No VS Code plugin found"
          fi
          
          # Copy IntelliJ plugin (look for it recursively)
          if [ -d "all-artifacts/intellij-artifacts" ]; then
            find all-artifacts/intellij-artifacts -type f -name "*.zip" -exec cp {} release-assets/ \; 2>/dev/null || echo "No IntelliJ plugin found"
          fi
          
          echo "Final release assets:"
          ls -la release-assets/
      
      - name: Upload artifacts to release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: build-${{ github.sha }}
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-docker-images:
    needs: create-release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - "license-api"
          - "landing-page"
          - "docs"
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        if: github.event_name == 'push'
      - name: Log in to the Container registry
        uses: docker/login-action@v2
        if: github.event_name == 'push'
        with:
          registry: ${{ vars.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v4
        if: github.event_name == 'push'
        with:
          images: ${{ vars.DOCKER_REGISTRY }}/${{ github.repository_owner }}/${{ matrix.target }}
          tags: |
            type=sha,enable={{is_default_branch}}
            # branch event
            type=ref,event=branch
            # tag event
            type=ref,event=tag
            # set latest tag for default branch
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push
        uses: docker/build-push-action@v4
        if: github.event_name == 'push'
        with:
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
      # get the github.event.ref without the leading refs/heads/
      - name: Extract deleted branch name
        if: github.event_name == 'delete'
        run: |
          DELETE_REF="${{ github.event.ref }}"
          echo "BRANCH_NAME=${DELETE_REF#refs/heads/}" >> $GITHUB_ENV
      - name: Delete image on branch delete
        uses: bots-house/ghcr-delete-image-action@v1.1.0
        if: github.event_name == 'delete'
        with:
          owner: ${{ github.repository_owner }}
          name: ${{ matrix.target }}
          token: ${{ github.token }}
          tag: ${{ env.BRANCH_NAME }}
      - name: Delete all untagged images on branch delete
        uses: bots-house/ghcr-delete-image-action@v1.1.0
        if: github.event_name == 'delete'
        with:
          owner: ${{ github.repository_owner }}
          name: ${{ matrix.target }}
          token: ${{ github.token }}
          untagged-keep-latest: 3
