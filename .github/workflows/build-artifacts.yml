name: Build Artifacts and Create Release

on:
  push:
    tags: ["v*"]

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          draft: false
          prerelease: false

  build-or-delete-images:
    needs: create-release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - "codechart"
          - "license-api"
          - "landing-page"
          - "docs"
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        if: github.event_name == 'push'
      - name: Log in to the Container registry
        uses: docker/login-action@v2
        if: github.event_name == 'push'
        with:
          registry: ${{ vars.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v4
        if: github.event_name == 'push'
        with:
          images: ${{ vars.DOCKER_REGISTRY }}/${{ github.repository_owner }}/${{ matrix.target }}
          tags: |
            type=sha,enable={{is_default_branch}}
            # branch event
            type=ref,event=branch
            # tag event
            type=ref,event=tag
            # set latest tag for default branch
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push
        uses: docker/build-push-action@v4
        if: github.event_name == 'push'
        with:
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
      # get the github.event.ref without the leading refs/heads/
      - name: Extract deleted branch name
        if: github.event_name == 'delete'
        run: |
          DELETE_REF="${{ github.event.ref }}"
          echo "BRANCH_NAME=${DELETE_REF#refs/heads/}" >> $GITHUB_ENV
      - name: Delete image on branch delete
        uses: bots-house/ghcr-delete-image-action@v1.1.0
        if: github.event_name == 'delete'
        with:
          owner: ${{ github.repository_owner }}
          name: ${{ matrix.target }}
          token: ${{ github.token }}
          tag: ${{ env.BRANCH_NAME }}
      - name: Delete all untagged images on branch delete
        uses: bots-house/ghcr-delete-image-action@v1.1.0
        if: github.event_name == 'delete'
        with:
          owner: ${{ github.repository_owner }}
          name: ${{ matrix.target }}
          token: ${{ github.token }}
          untagged-keep-latest: 3
