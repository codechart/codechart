name: Docker

on:
  push:
    branches: ['**']

  delete:
    branches: ['**']

jobs:
  build-or-delete-images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: ["codechart", "license-api"]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        if: github.event_name == 'push'
      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ${{ vars.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v4
        if: github.event_name == 'push'
        with:
          images: ${{ vars.DOCKER_REGISTRY }}/${{ github.repository_owner }}/${{ matrix.target }}
          tags: |
            type=sha,enable={{is_default_branch}}
            # branch event
            type=ref,event=branch
            # tag event
            type=ref,event=tag
            # set latest tag for default branch
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push
        uses: docker/build-push-action@v4
        if: github.event_name == 'push'
        with:
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Delete image on branch delete
        uses: bots-house/ghcr-delete-image-action@v1.1.0
        if: github.event_name == 'delete'
        with:
          owner: ${{ github.repository_owner }}
          name: ${{ matrix.target }}
          token: ${{ github.token }}
          tag: ${{ github.ref_name }}
      - name: Delete all untagged images on branch delete
        uses: bots-house/ghcr-delete-image-action@v1.1.0
        if: github.event_name == 'delete'
        with:
          owner: ${{ github.repository_owner }}
          name: ${{ matrix.target }}
          token: ${{ github.token }}
          untagged-keep-latest: 0
