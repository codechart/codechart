language: node_js
node_js:
- 14
script:
- npm run build
addons:
  ssh_known_hosts: $DEPLOY_HOST
before_deploy:
- openssl aes-256-cbc -K $encrypted_d8516a3ba3c2_key -iv $encrypted_d8516a3ba3c2_iv -in ci/deploy_rsa.enc -out /tmp/deploy_rsa -d
- eval "$(ssh-agent -s)"
- chmod 600 /tmp/deploy_rsa
- ssh-add /tmp/deploy_rsa
deploy:
  provider: script
  skip_cleanup: true
  script: rsync -r --delete-after --quiet $TRAVIS_BUILD_DIR/dist root@$DEPLOY_HOST:/root/public
  on:
    tags: true
    all_branches: true