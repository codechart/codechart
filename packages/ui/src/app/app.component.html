<div class="main">
  <div class="topbox">
    <div class="buttonsbox">
      <div>
        <button (click)="chartActions.clearChart()">clear results</button>
        <button (click)="clearDimmed()">clear dimmed</button>
        <label> | </label>
        <button (click)="reload()">reload</button>
        <label> | </label>
        <button (click)="fullSaveToFile()">full save</button>
        <button (click)="jsonSave()">json save</button>
        <label>load
          <input id='fileLoadInput' type="file" (change)="loadFromFile($event)"/>
        </label>
        <label> | </label>
        <button (click)="clearVisiIds()">clear visi ids</button>
        <button (click)="rewriteVisiIds()">rewrite visi ids</button>
        <label> | </label>
        <button (click)="undo()">undo</button>
        <label> | </label>
        <button *ngFor="let item of linkTypes" (click)="linkNodes($event.target.innerText)" class="mr5">
          {{item}}
        </button>
        <button *ngFor="let item of shapeTypes" (click)="createShape($event.target.innerText)" class="mr5">
          {{item}}
        </button>
        <label> | </label>
        <span *ngFor="let color of nodesColors" class="colorpick" [ngStyle]="{'background-color':color}"
              (click)="setSelecteionColor(color)"></span>
        <label> | </label>
        <span><input placeholder='size' type="text" [ngModel]="selectedNodeSize" (keyup)="setSelectedNodesSize($event.target.value)" style="width: 25px" /></span>
        <button (click)="setEdgePoint(true, false)">
          <-</button> <button (click)="setEdgePoint(false, true)">->
      </button>
        <button (click)="setEdgePoint(false, false)">-</button>
        <button (click)="setEdgePoint(true, true)">
          <->
        </button>
      </div>
      <div>
        <label>search: </label>
        <button (click)="searchActions.totalSearch()">full</button>
        <button (click)="searchActions.searchSelectedFile()">file</button>
        <button (click)="searchActions.contentSearch()">content</button>
        <label> | </label>
        <span></span><input placeholder='pattern' type="text" [(ngModel)]="searchJson.pattern" (keypress)="performSearch($event)">
        <span></span><input placeholder='regex flags' type="text" [(ngModel)]="searchJson.flags" style="width: 40px" />
        <span>rgxp</span><input type="checkbox" [(ngModel)]="searchJson.isRegex" />
        <label> | </label>
        <span></span><input placeholder='path' type="text" [(ngModel)]="searchJson.path" style="width: 150px" />
        <span></span><input placeholder='file pattern' type="text" [(ngModel)]="searchJson.filenamePattern" style="width: 150px" />
        <span>rgxp</span><input type="checkbox" [(ngModel)]="searchJson.isFileNameRegex" />
        <label> | </label>
        <button (click)="createMatchFromSelection()">match from selected</button>
        <button (click)="connectNodesInsideContent()">connect to content nodes</button>
      </div>
      <div>
        <button *ngFor="let item of mySpecificSearchJsons" (click)="performSavedSearch(item)">{{item.name}}</button>
      </div>
    </div>
    <div style="flex-grow:1">
      <textarea id='nodeTitle' [ngModel]="selectedNode?.label" (keyup)="setTitle($event)" style="width:90%"></textarea>
    </div>
  </div>
  <div class="filer">
    <div id="bordered">
      <div id="fullbox">
        <span class="cfilename">{{currentFile?.name}}</span>
        <div id="fileContainer">
          <pre id="codepre"><code  id="fileContent" [innerHTML]="currentFile?.content"></code></pre>
        </div>
      </div>
    </div>
    <div class="h100w50">
      <div class="h100">
        <div id="vis_element"></div>
      </div>
    </div>

  </div>
  <div id='message_box' >
    <pre>{{messageBoxQueue[0]?.title}}</pre>
    <div>{{messageBoxQueue[0]?.message}}</div>
  </div>
</div>
