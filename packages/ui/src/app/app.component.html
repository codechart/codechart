<div style="display: flex; flex-direction: column; height:100%">
  <div style="width: 100%">
    <button (click)="vlaActions.clearChart()" >clear results</button>
    <label> | </label>
    <button (click)="reload()">reload</button>
    <label> | </label>
    <button (click)="clearDimmed()">clear dimmed</button>
    <label> | </label>
    <button (click)="saveToFile()">save</button>
    <label>load
      <input type="file" (change)="loadFromFile($event)" style="visibility: hidden" />
    </label>
    <label> | </label>
    <button (click)="undo()">undo</button>
    <label> | </label>
    <button *ngFor="let item of linkTypes" (click)="linkNodes($event.target.innerText)" style="margin-right:5px">{{item}}</button>
    <button *ngFor="let item of shapeTypes" (click)="createShape($event.target.innerText)" style="margin-right:5px">{{item}}</button>
    <label> | </label>
    <input id='nodeTitle' type="text" [ngModel]="selectedNode?.label" (keyup)="setTitle($event)" />
  </div>
  <div style="width: 100%">
    <button (click)="searchActions.totalSearch()">total search</button>
    <button (click)="searchActions.searchSelectedFile()">file search</button>
    <button (click)="searchActions.contentSearch()">content search</button>
    <label> | </label>
    <span>pattern: </span><input type="text" [(ngModel)]="searchJson.pattern" />
    <span>flags: </span><input type="text" [(ngModel)]="searchJson.flags" />
    <span>file extension: </span><input type="text" [(ngModel)]="searchJson.fileExtensions" />
    <span>path: </span><input type="text" [(ngModel)]="searchJson.path" />
    <span>is regex: </span><input type="checkbox" [(ngModel)]="searchJson.isRegex" />
  </div>
  <div style="display: flex; height:900px">
    <div style="width: 50%; border: 1px solid black">
      <div style="display: flex; flex-direction: column; width:100%; height:100%">
        <span style="height:3%">{{currentFile?.name}}</span>
          <div style="display: flex; width:100%; height:100%; border: 1px solid">
          <div id="linesContainer" style="height:100%; overflow: auto; width: 3%">
            <div *ngFor="let line of currentFile?.lines; let i = index">{{i}}</div>
          </div>
          <textarea id="fileContent" #fileContent class="searchInput" style="width: 97%; height:100%; line-height: 15px">{{currentFile?.content}}</textarea>
        </div>
      </div>
    </div>
      <div style="height:100%; width: 50%">
        <div style="flex: 1; height:100%">
          <div id="vis_element" style="flex: 1; border: 1px solid black; height:100%"></div>
      </div>
    </div>

  </div>
</div>
