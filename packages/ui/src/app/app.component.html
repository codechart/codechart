<div style="display: flex; flex-direction: column; height:100%">
  <div style="width: 100%">
    <button (click)="chartActions.clearChart()">clear results</button>
    <button (click)="clearDimmed()">clear dimmed</button>
    <label> | </label>
    <button (click)="reload()">reload</button>
    <label> | </label>
    <button (click)="saveToFile()">save</button>
    <label>load
      <input id='fileLoadInput' type="file" (change)="loadFromFile($event)" style="visibility: hidden; width: 0px"/>
    </label>
    <label> | </label>
    <button (click)="clearVisiIds()">clear visi ids</button>
    <button (click)="rewriteVisiIds()">rewrite visi ids</button>
    <label> | </label>
    <button (click)="undo()">undo</button>
    <label> | </label>
    <button *ngFor="let item of linkTypes" (click)="linkNodes($event.target.innerText)" style="margin-right:5px">
      {{item}}
    </button>
    <button *ngFor="let item of shapeTypes" (click)="createShape($event.target.innerText)" style="margin-right:5px">
      {{item}}
    </button>
    <label> | </label>
    <input id='nodeTitle' type="text" [ngModel]="selectedNode?.label" (keyup)="setTitle($event)"/>
    <label> | </label>
    <span *ngFor="let color of nodesColors" style="width:20px; margin: 1px; cursor: pointer" [ngStyle]="{'background-color':color}" (click)="setSelecteionColor(color)">*</span>
  </div>
  <div style="width: 100%">
    <label>search: </label>
    <button (click)="searchActions.totalSearch()">full</button>
    <button (click)="searchActions.searchSelectedFile()">file</button>
    <button (click)="searchActions.contentSearch()">content</button>
    <label> | </label>
    <span>pattern: </span><input type="text" [(ngModel)]="searchJson.pattern"/>
    <span>flags: </span><input type="text" [(ngModel)]="searchJson.flags" style="width: 40px"/>
    <span>file regex: </span><input type="text" [(ngModel)]="searchJson.filenameRegex" style="width: 40px"/>
    <span>path: </span><input type="text" [(ngModel)]="searchJson.path" style="width: 60px"/>
    <span>is regex: </span><input type="checkbox" [(ngModel)]="searchJson.isRegex"/>
    <label> | </label>
    <button (click)="createMatchFromSelection()">match from selected</button>
    <button (click)="connectNodesInsideContent()">connect to content nodes</button>
  </div>
  <div style="display: flex; height:900px">
    <div style="width: 50%; border: 1px solid black">
      <div style="display: flex; flex-direction: column; width:100%; height:100%">
        <span style="height:3%; border: 1px solid">{{currentFile?.name}}</span>
        <div id="fileContainer" style="display: flex; width:100%; height:100%; overflow: auto; border: 1px solid" >
          <textarea id="lines" class="searchInput"
                    style="width: 3%; border: solid 1px right; height: 50000px; line-height: 15px; text-align: right">{{getLinesNumbersText(currentFile)}}</textarea>
          <textarea id="fileContent" class="searchInput" spellcheck="false"
                    style="width: 97%; border: none; height: 50000px; line-height: 15px">{{currentFile?.content}}</textarea>
        </div>
      </div>
    </div>
    <div style="height:100%; width: 50%">
      <div style="flex: 1; height:100%">
        <div id="vis_element" style="flex: 1; border: 1px solid black; height:100%"></div>
      </div>
    </div>

  </div>
</div>
