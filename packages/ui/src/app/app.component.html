<div style="display: flex; flex-direction: column; height:900px">
  <div style="width: 100%">
    <button (click)="vlaActions.clearChart()" style="height:5%">clear results</button>
    <label>resize old</label><input type="checkbox" [(ngModel)]="reduceSizeOfOldNodes" />
    <label> | </label>
    <button (click)="searchActions.totalSearch()" style="height:5%">total search</button>
    <button (click)="searchActions.searchSelectedFile()" style="height:5%">file search</button>
    <button (click)="searchActions.contentSearch()" style="height:5%">content search</button>
    <button (click)="undo()" style="height:5%">undo</button>
    <button (click)="reload()" style="height:5%">re-arrange</button>
    <button (click)="linkNodes()" style="height:5%">link Nodes</button>
    <button (click)="createRemark(selectedNode)" style="height:5%">remark</button>
    <label> | </label>
    <button (click)="saveToFile()" style="height:5%">save</button>
    <input type="file" (change)="loadFromFile($event)" style="height:5%" />
  </div>
  <div style="display: flex; height:900px">
    <div style="display: flex; flex-direction: column; width: 25%; border: 1px solid black">
      <div style="display: flex; flex-direction: column; ; flex: 1; overflow:auto">
        <span style="font-weight: bold; font-style: italic"> search </span>
        <!--<span>title</span><input type="text" [(ngModel)]="searchJson.title"/>-->
        <span>pattern</span><input type="text" [(ngModel)]="searchJson.pattern" />
        <span>flags</span><input type="text" [(ngModel)]="searchJson.flags" />
        <span>file extension</span><input type="text" [(ngModel)]="searchJson.fileExtensions" />
        <span>path</span><input type="text" [(ngModel)]="searchJson.path" />
      </div>
      <div style="border-top: 1px solid black; display: flex; flex-direction: column; flex: 1; overflow:auto">
        <span style="font-weight: bold; font-style: italic"> selected label properties</span>
        <label>title:</label>
        <input id='nodeTitle' type="text" [ngModel]="selectedNode?.t" (keyup)="setTitle($event)" />
        <label>line:</label>
        <input type="text" [ngModel]="selectedNode?.d.line" />
        <label>line number</label>
        <input type="text" [(ngModel)]="selectedNode?.d.lineNumber" />
        <span>value</span>
        <input type="text" [(ngModel)]="selectedNode?.d.value" />
        <label>level</label>
        <input type="text" [(ngModel)]="selectedNode?.d.level" />
        <label>index</label>
        <input type="text" [(ngModel)]="selectedNode?.d.index" />
        <!--<textarea #selectedNodeText style="height:100%; width:100%;" class="searchInput" >{{visibleNodeProps|json}}</textarea>-->
      </div>
      <div style="border-top: 1px  solid black; flex: 1; overflow:auto">
        <div *ngFor="let search of resultsHistory">
          <span *ngIf="search.searchJson!==null " [style.color]="search.color">{{search.searchJson.pattern}}</span>
          <span *ngIf="search.searchJson===null">delete</span>
        </div>
      </div>
      <div style="border-top: 1px  solid black; flex: 1; overflow:hidden">
        <div style="">
          <button (click)="saveTypeMapping(typesMappingText.value)">save types mapping</button>
        </div>
        <textarea #typesMappingText style="height:85%; width:100%;" class="searchInput">{{typesMapping|json}}</textarea>
      </div>
      <div style="border-top: 1px solid black;flex: 1; overflow:hidden">
        <div style="">
          <button (click)="setSelectedNodeJson(selectedNodeJson.value)">set node json</button>
        </div>
        <textarea #selectedNodeJson style="height:85%; width:100%;" [ngModel]="visibleNodeProps" class="searchInput"></textarea>
      </div>
      <!--<textarea #searchJsonText class="searchInput" style="height:25%" style="width:100%; border: 1px solid black">{{searchJson|json}}</textarea>-->
    </div>
    <div style="width: 24%; border: 1px solid black">
      <div style="display: flex; flex-direction: column; width:100%; height:100%">
        <span style="height:3%">{{currentFile?.name}}</span>
          <div style="display: flex; width:100%; height:100%">
          <div id="linesContainer" style="height:100%; overflow: auto">
            <div *ngFor="let line of currentFile?.lines; let i = index">{{i}}</div>
          </div>
          <textarea id="fileContent" #fileContent class="searchInput" style="width: 100%; height:97%; line-height: 15px">{{currentFile?.content}}</textarea>
        </div>
      </div>
    </div>
      <div style="height:100%; width: 49%">
        <div style="flex: 1; border: 1px solid black">
        <kl-components>
          <kl-component id='kl' klType='chart' (klReady)='klChartReady($event)' [ngStyle]="{'width': '1000%', 'height':'900px'}"></kl-component>
        </kl-components>
      </div>
    </div>

  </div>
</div>
