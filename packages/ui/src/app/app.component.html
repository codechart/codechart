<!-- <pre id="fileContent" ><code [innerHTML]="sampleContent"></code></pre> -->
<textarea *ngIf="showNodeEditBox" id='nodeTitle' [ngModel]="selectedNode?.label" (keyup)="setTitle($event)"></textarea>
<div class="main">
  <div class="topbox">
    <div class="dropdown mr5">
      <button class="btn btn-primary dropdown-toggle" type="button" data-toggle="dropdown">File
        <span class="caret"></span>
      </button>
      <ul class="dropdown-menu ">
        <li (click)="saveJsonVisible = true" class="dropdown-item">Json Save</li>
        <li class="dropdown-item"><label style="cursor: pointer">json load
          <input id='fileLoadInput' type="file" (change)="loadFromFile($event)"/>
        </label>
        </li>
        <li (click)="saveFullVisible = true" class="dropdown-item">full save</li>
        <li (click)="reload()" class="dropdown-item">reload</li>
        <li (click)="clearVisiIds()" class="dropdown-item">clear visi ids</li>
        <li (click)="rewriteVisiIds()" class="dropdown-item">rewrite visi ids</li>
      </ul>
    </div>
    <div class="dropdown mr5">
      <button class="btn btn-primary dropdown-toggle" type="button" data-toggle="dropdown">Config
        <span class="caret"></span>
      </button>
      <ul class="dropdown-menu">
        <div style="display:flex">
          <p-dropdown [editable]="true" [options]="paths" (click)="pathDropdownClick($event)" [(ngModel)]="pathTyped" (onChange)="setSelectedPath($event)"
                      [filter]="true" [style]="{'width': '500px','margin': '5px'}"></p-dropdown>
          <button *ngIf="pathGoVisible"(click)="setSelectedPath(pathTyped)" class="mr5">Go</button>
        </div>
        <li>
          <input placeholder='file pattern' type="text" [(ngModel)]="searchJson.filenamePattern"
                 style="width: 150px;margin: 5px;"/>
          <span><img height="25" width="25" src="assets/icons/regex.png"/></span><input type="checkbox"
                                                                                        [(ngModel)]="searchJson.isFileNameRegex"/>
          <br/>
        </li>
      </ul>
    </div>
    <span class="seperater"> | </span>
    <button (click)="undo()" class="mr5"><i class="fa fa-undo" aria-hidden="true"> </i></button>
    <button (click)="chartActions.clearChart()" class="mr5">clear results</button>

    <button *ngFor="let item of linkTypes" (click)="linkNodes(item)" class="mr5">
      <i class="fa fa-link" aria-hidden="true"></i>
    </button>
    <button *ngFor="let item of shapeTypes" (click)="createShape(item)" class="mr5">
      <i class="fa fa-commenting-o" aria-hidden="true"></i>
    </button>
    <span class="seperater"> | </span>
    <input placeholder='pattern' class="mr5" type="text" [(ngModel)]="searchJson.pattern"
           (keypress)="performSearch($event)">
    <input placeholder='regex flags' class="mr5" type="text" [(ngModel)]="searchJson.flags" style="width: 40px"/>
    <div>
      <span><img height="25" width="25" src="assets/icons/regex.png"/></span><input type="checkbox"
                                                                                    [(ngModel)]="searchJson.isRegex"/>
    </div>
    <button (click)="openFileVisible=true" class="mr5"><i class="fa fa-file-code-o" aria-hidden="true"></i>
    </button>
    <button (click)="searchActions.totalSearch()" class="mr5"><i class="fa fa-folder-o" aria-hidden="true"></i></button>
    <button (click)="searchActions.searchSelectedFile()" class="mr5"><i class="fa fa fa-file-o" aria-hidden="true">
    </i></button>
    <button (click)="searchActions.contentSearch()" class="mr5">(..)</button>
    <button (click)="createMatchFromSelection()" class="mr5"><i class="fa fa-hand-pointer-o" aria-hidden="true"></i>
    </button>
    <button (click)="createFileNode()" class="mr5"><i class="far fa-plus-square" aria-hidden="true"></i></button>
    <span class="seperater"> | </span>
    <button *ngFor="let item of mySpecificSearchJsons" class="mr5"
            (click)="performSavedSearch(item)">{{item.name}}</button>
    <div class="dropdown mr5">
      <button class="btn btn-primary dropdown-toggle" type="button" data-toggle="dropdown"><i class="fa fa-paint-brush"
                                                                                              aria-hidden="true"></i>
        <span class="caret"></span>
      </button>
      <ul class="dropdown-menu dropdown-menu-right">
        <li style="margin: 5px;">
          <span *ngFor="let color of nodesColors" class="colorpick" [ngStyle]="{'background-color':color}"
                (click)="setSelecteionColor(color)"></span>
        </li>
        <li style="margin: 5px;">
          <span><input placeholder='size' type="text" [ngModel]="selectedNodeSize"
                       (keyup)="setSelectedNodesSize($event.target.value)" style="width: 40px"/></span>
          <button (click)="setEdgePoint(true, false)">-></button>
          <button (click)="setEdgePoint(false, true)">
            <-
          </button>
          <button (click)="setEdgePoint(false, false)">-
          </button>
          <button (click)="setEdgePoint(true, true)">
            <->
          </button>
        </li>
        <li style="margin: 5px;">
        </li>
      </ul>
    </div>
  </div>
  <div class="filer">
    <div id="bordered">
      <div id="fullbox">
        <div class="cfilenameholder" style="display: flex">
          <button (click)="increaseFileContentFont()"> <i class="fa fa-plus" aria-hidden="true"></i></button>
          <button (click)="decreaseFileContentFont()"> <i class="fa fa-minus" aria-hidden="true"></i></button>
          <span class="cfilename">{{currentFile?.name}}</span>
        </div>
        <div id="fileContainer" class="fileContainer">
          <pre id="codepre"><code id="fileContent" [innerHTML]="currentFile?.content"></code></pre>
        </div>
      </div>
    </div>
    <div class="h100w50" style="border: 1px solid black">
      <div id="vis_element" style="height:100%" (click)="clickedChart($event)"></div>
    </div>
  </div>
  <div id='message_box'>
    <pre>{{messageBoxQueue[0]?.title}}</pre>
    <div>{{messageBoxQueue[0]?.message}}</div>
  </div>
</div>
<p-dialog [contentStyle]="{'overflow':'visible'}" [(visible)]="openFileVisible" [width]="800" [height]="500" (onShow)="focusOnFileOpenInput()">
  <p-header> Get File</p-header>
  <p-autoComplete #openfileInput [suggestions]="openFileSuggestions" (onSelect)="getFile($event); openFileVisible=false"
                  (completeMethod)="filterAvailableFiles($event.query)" [delay]="0"
                  [style]="{'width': '500px'}"></p-autoComplete>
</p-dialog>
<p-dialog [(visible)]="saveJsonVisible">
  <p-header> Enter File Name</p-header>
  <input type="text" style="width:100%" [(ngModel)]="saveJsonFileName"/>
  <p-footer>
    <button type="button" (click)="saveJsonVisible=false">Cancel</button>
    <button type="button" (click)="jsonSave(); saveJsonVisible=false">Save</button>
  </p-footer>
</p-dialog>
<p-dialog [(visible)]="saveFullVisible" [width]="800" [height]="500">
  <p-header> Enter File Name</p-header>
  <input type="text" style="width:100%" [(ngModel)]="saveJsonFileName"/>
  <p-footer>
    <button type="button" (click)="saveFullVisible=false">Cancel</button>
    <button type="button" (click)="fullSaveToFile(); saveFullVisible=false">Save</button>
  </p-footer>
</p-dialog>
