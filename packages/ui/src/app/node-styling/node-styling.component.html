<div class="full-body">
  <textarea *ngIf="selectedNode" id='nodeTitleInput' [ngModel]="selectedNode?.label" (keyup)="setTitle($event)"></textarea>

  <div class="tabs-wrapper">
    <span class="tab" [ngClass]="stylingType===StylingTypes.edge ? 'active' : 'inactive'"
          (click)="changeType($event, StylingTypes.edge)">Edge</span>
    <span class="tab" [ngClass]="stylingType===StylingTypes.node ?  'active' : 'inactive'"
          (click)="changeType($event, StylingTypes.node)">Node</span>
  </div>
  <div *ngIf="stylingType==StylingTypes.node" class="body-wrapper">
    <div>
      <div class="color-picker-wrapper">
          <span *ngFor="let style of nodeStyles" class="colorpick" [ngStyle]="{
                 'background-color':style.background, 'border-color': style.border
                }" (click)="setSelectionNodeStyle(style)">
        </span>
      </div>
      <div class="topbox">
        <div class="drop-down icons">
          <button pTooltip="Icons" data-toggle="dropdown" class="div-dropdown-button">
            <img src={{nodeImages[0].path}}>
          </button>
          <div class="dropdown-menu ccDropDown">
            <div *ngFor="let image of nodeImages" (click)="setSelectionImage(image.path)"
                 (click)="setSelectionImage(image.path)">
            <span>
              <img src={{image.path}}>
            </span>
              <span>{{image.name | prettify}}</span>
            </div>
          </div>
        </div>
        <div class="drop-down shapes">
          <button pTooltip="Shapes" data-toggle="dropdown" class="div-dropdown-button">
            <i class={{nodeShapes[0].faClass}}></i>
          </button>
          <div class="dropdown-menu ccDropDown">
            <div *ngFor="let shape of nodeShapes" (click)="setSelectionShape(shape.visShape)">
            <span>
              <i class={{shape.faClass}}></i>
            </span>
              <span>{{shape.visShape | prettify}}</span>
            </div>
          </div>
        </div>
        <div class="drop-down">
          <button pTooltip="Other" data-toggle="dropdown">
            <img src="./../assets/icons/svg/Custom.png">
          </button>
          <div class="dropdown-menu">
            <div (click)="showHideFile()">
              <span>
                <img src="./../assets/icons/svg/Hide Files.svg">
              </span>
              <span>{{"Toggle file nodes of selection" | prettify}}</span>
            </div>
            <div (click)="toggleShowAdvanced()">
              <span>
                <img src="./../assets/icons/svg/Advanced.png">
              </span>
              <span>{{"Toggle advanced" | prettify}}</span>
            </div>
          </div>
        </div>
      </div>
      <div>
        <span>Node Size: {{selectedItemSize}}</span>
        <p-slider [(ngModel)]="selectedItemSize" (onChange)="setSelectedNodesSize($event.value)" [min]="0"
                  [max]="400" [step]="10"></p-slider>
      </div>
      <div>
        <span>Font Size: {{selectedItemFontSize}}</span>
        <p-slider [(ngModel)]="selectedItemFontSize" (onChange)="setSelectedNodesFontSize($event.value)"
                  [min]="0" [max]="400" [step]="10"></p-slider>
      </div>
    </div>
  </div>

<div *ngIf="showAdvanced">
  <textarea #styleElement style="width: 100%; height: 400px"> {{selecedItemStyle | json}}</textarea>
  <div>
    <button (click)="applyManualStyle()">
      apply
