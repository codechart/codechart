<div class="side-menu">
  <button class="slide-toggle" [class.open]="isOpen" (click)="toggleMenu()">
    <i class="fa-solid fa-compass"></i>
  </button>
  <div class="menu-content" [class.open]="isOpen">
    <div class="menu-group" *ngFor="let group of menuGroups">
      <div class="group-title" (click)="toggleGroup(group.type)" [class.active]="selectedGroupType === group.type">
        {{group.type | prettify}}
        <i class="fa-solid" [class.fa-chevron-down]="selectedGroupType === group.type"
          [class.fa-chevron-right]="selectedGroupType !== group.type"></i>
      </div>
      <div class="group-items" *ngIf="selectedGroupType === group.type">
        <div class="menu-item" *ngFor="let node of group.nodes" (click)="toggleItems(node.nodeId)">
          <span class="item-text" [class.strike-through]="node.info.isDone"
            (click)="toggleDone(node); $event.stopPropagation()">{{node.info.text}}</span>
        </div>
      </div>
    </div>
  </div>
</div>
