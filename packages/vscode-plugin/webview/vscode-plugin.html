<!DOCTYPE html>
<html>

<head>
    <!-- <link rel="stylesheet" href="./css/ide-plugin.css"> -->

</head>
<style>
    body,
    html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        box-sizing: border-box;
    }

    #myFrame1 {
        width: 100%;
        height: 100%;
    }

    iframe {
        width: 100%;
        height: 100%;
        border: none;
        display: block;
    }

    .test {
        width: 100%;
        height: 100%;
        border: none;
        display: block;
    }
</style>

<body>
    <div id='myFrame1'>
        <iframe id='myFrame' src=""></iframe>
    </div>
</body>
<script>
    const vscode = acquireVsCodeApi();

    const ccUrls = ['http://localhost:4300', 'http://localhost:2800', 'http://localhost:2900']
    let frameElement
    window.onload = function () {
        console.log('loaded')
        frameElement = document.getElementById('myFrame')
        frameElement.style.width = window.innerWidth + 'px'
        frameElement.style.height = window.innerHeight + 'px'
        frameElement.onLoad = () => {
            frameElement.contentWindow.postMessage({ action: 'runningInIde' }, '*')
        }

    }

    function checkUrl(url) {
        return new Promise((resolve, reject) => {
            const xhr = new XMLHttpRequest()
            xhr.open('GET', url)
            xhr.onload = () => {
                if (xhr.status === 200) {
                    console.log('connected to ' + url)
                    resolve(xhr.response)
                } else {
                    console.log('failed connecting to ' + url)
                    reject(xhr.statusText)
                }
            }
            xhr.onerror = () => {
                console.log('failed connecting to ' + url)
                reject('Network Error')
            }
            xhr.send()
        })
    }

    function tryConnections(urls) {
        Promise.allSettled(urls.map(i => checkUrl(i)))
            .then((results) => {
                const successIndex = results.findIndex(result => result.status === 'fulfilled');
                if (successIndex === -1) {
                    alertUser('Covalent agent is not running!\nstart the agent and refresh', true);
                } else {
                    console.log('frame url:', urls[successIndex])                   
                    frameElement.src = urls[successIndex];
                }
            }
            );
    }

    tryConnections(ccUrls)

    // Unified message event listener for both IDE and webview messages
    window.addEventListener("message", async (event) => {
        const message = event.data;
        console.log('frame window message received:', message);

        // Handle messages from IDE
        switch (message.action) {
            case "setProjectPath_ideEvent":
                handleSetProjectPath_ideEvent(message);
                break;

            case "clickedOnLine_ideEvent":
                handleClickedOnLine_ideEvent(message);
                break;

            case "clickedOnFile_ideEvent":
                handleClickedOnFile_ideEvent(message);
                break;

            case "LineNumberChanged_ideEvent":
                handleLineNumberChanged_ideEvent(message);
                break;

            case "updateWebviewMd_ideEvent":
                handleUpdateWebviewMd_ideEvent(message);
                break;

            case "getProjectPath_webviewEvent":
                handleGetProjectPath_webviewEvent();
                break;

            // Handle messages from webview
            case "goToLineInIde_webviewEvent":
                await handleGoToLineInIde_webviewEvent(message);
                break;
        }
    });

    function handleSetProjectPath_ideEvent(message) {
        console.log('setProjectPath');
        frameElement.contentWindow.postMessage({
            action: "setProjectPath_ideEvent",
            data: {
                projectPath: message.data.projectPath
            }
        }, '*');
    }

    function handleClickedOnLine_ideEvent(message) {
        clickedOnLineInIde(
            message.action,
            message.data.lineContent,
            message.data.lineNumber,
            message.data.filePath,
            message.data.projectPath,
            message.data.fileContent,
            message.data.isReplaceNode
        );
    }

    function handleClickedOnFile_ideEvent(message) {
        clickedOnFileInIde(
            message.action,
            message.data.filePath,
            message.data.projectPath,
            message.data.fileContent,
            message.data.filesInFolder
        );
    }

    function handleLineNumberChanged_ideEvent(message) {
        eventInfoElement.innerHTML = message.action;
        lineFilePathElement.innerHTML = message.currentFilePath;
        goToLineNumber.value = message.lineNumber;
        goToFilePath.value = message.currentFilePath;
        lineNumberElement.innerHTML = message.lineNumber;
    }

    function handleUpdateWebviewMd_ideEvent(message) {
        webviewMdTextArea.value = message.text;
        console.log(message.text);
    }

    function handleGetProjectPath_webviewEvent() {
        vscode.postMessage({ action: "getProjectPath_webviewEvent" });
    }

    async function handleGoToLineInIde_webviewEvent(message) {
        try {
            await goToLineInIDE(
                message.data.projectPath,
                message.data.filePath,
                message.data.lineNumber
            );
        } catch (ex) {
            console.error(ex);
        }
    }

    function clickedOnLineInIde(ideEventObject, lineContent, lineNumber, filePath, projectPath, fileContent, isReplaceNode) {
        console.log('clicked on line: ' + lineNumber + ' in file: ' + filePath)
        frameElement.contentWindow.postMessage({
            action: "clickedOnLine_ideEvent",
            data: {
                lineContent: lineContent,
                lineNumber: lineNumber,
                filePath: filePath,
                projectPath: projectPath,
                isReplaceNode: isReplaceNode,
            },
        }, '*');
    }


    function clickedOnFileInIde(ideEventObject, fileOrFolderPath, projectPath, fileContent, filesInFolder) {
        frameElement.contentWindow.postMessage({
            action: "clickedOnFile_ideEvent",
            data: {
                isReplaceNode: false,
                fileOrFolderPath: fileOrFolderPath,
                projectPath: projectPath,
                fileContent: fileContent,
                filesInFolder: filesInFolder,
            },
        }, '*');
    }

    function goToLineInIDE(projectPath, filePath, lineNumber) {
        vscode.postMessage({
            action: "goToLineEvent",
            projectPath: projectPath,
            filePath: filePath,
            lineNumber: lineNumber
        });
    }

    function displayInputInReadmeElement(readmeText) {
        frameElement.contentWindow.postMessage({
            action: 'displayContentInReadmeElement', data: {
                readmeText: readmeText,
            },
        }, '*')
    }

    function alertUser(text, coverScreen = false) {
        const overlay = document.createElement('div');
        overlay.style.cssText = `
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 999;
            animation: fadeIn 0.2s ease-out;
        `;

        const alertDiv = document.createElement('div');
        alertDiv.style.cssText = `
        position: ${coverScreen ? 'fixed' : 'absolute'};
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: white;
        padding: 25px 35px;
        border-radius: 8px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        z-index: 1000;
        text-align: center;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        min-width: 280px;
        max-width: 80%;
        animation: fadeIn 0.3s ease-out;
    `;

        const closeBtn = document.createElement('button');
        closeBtn.textContent = 'x';
        closeBtn.style.cssText = `
        position: absolute;
        right: 12px;
        top: 12px;
        border: none;
        background: none;
        cursor: pointer;
        font-size: 24px;
        color: #666;
        transition: color 0.2s;
        padding: 5px;
        line-height: 0.6;
    `;
        closeBtn.onmouseover = () => closeBtn.style.color = '#000';
        closeBtn.onmouseout = () => closeBtn.style.color = '#666';
        closeBtn.onclick = () => {
            alertDiv.remove();
            overlay.remove()
        }

        const message = document.createElement('p');
        message.textContent = text;
        message.style.cssText = `
        margin: 0;
        color: #333;
        line-height: 1.5;
        font-size: 16px;
    `;

        if (coverScreen) {
            alertDiv.appendChild(closeBtn);
            alertDiv.appendChild(message);
            overlay.appendChild(alertDiv);
            document.body.appendChild(overlay);
        } else {
            alertDiv.appendChild(closeBtn);
            alertDiv.appendChild(message);
            document.body.appendChild(alertDiv);
        }
    }
</script>

</html>
